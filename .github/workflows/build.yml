name: Build and release Sahl Adhan
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Public-domain (CC0) adhan recordings, originally from Wikimedia Commons:
      #   "Beautiful adhan.ogg" (Adam-synagda) and "Adhan.ogg"
      - name: Download adhan sounds
        run: |
          RAW=app/src/main/res/raw; mkdir -p $RAW
          SRC=https://raw.githubusercontent.com/rahmanSaaed/qibla-mobile/HEAD/assets/sounds
          curl -fSL --retry 3 -o $RAW/adhan_beautiful.ogg $SRC/adhan_full.ogg
          curl -fSL --retry 3 -o $RAW/adhan_classic.ogg $SRC/adhan_short.ogg
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -loglevel error -y -i $RAW/adhan_classic.ogg -t 10 -af "afade=t=out:st=7:d=3" -c:a libvorbis $RAW/takbir.ogg
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the KEYSTORE_B64 and KEYSTORE_PASS secrets first"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.keystore
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      - name: Name the APK
        run: cp app/build/outputs/apk/release/*.apk SahlAdhan-v1.${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Sahl Adhan v1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: SahlAdhan-v1.${{ github.run_number }}.apk
          make_latest: true
