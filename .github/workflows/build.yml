name: Build Sahl Adhan APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # If you uploaded the project as SahlAdhan.zip, unpack it first
      - name: Unpack zip if present
        run: |
          if [ -f SahlAdhan.zip ] && [ ! -f settings.gradle.kts ]; then
            unzip -o SahlAdhan.zip
            if [ -d SahlAdhan ]; then cp -r SahlAdhan/. . ; fi
          fi
      # Public-domain (CC0) adhan recordings, originally from Wikimedia Commons:
      #   "Beautiful adhan.ogg" (Adam-synagda) and "Adhan.ogg"
      - name: Download adhan sounds
        run: |
          RAW=app/src/main/res/raw; mkdir -p $RAW
          SRC=https://raw.githubusercontent.com/rahmanSaaed/qibla-mobile/HEAD/assets/sounds
          curl -fSL --retry 3 -o $RAW/adhan_beautiful.ogg $SRC/adhan_full.ogg
          curl -fSL --retry 3 -o $RAW/adhan_classic.ogg $SRC/adhan_short.ogg
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -loglevel error -y -i $RAW/adhan_classic.ogg -t 10 -af "afade=t=out:st=7:d=3" -c:a libvorbis $RAW/takbir.ogg
          ls -la $RAW
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SahlAdhan-apk
          path: app/build/outputs/apk/release/*.apk
