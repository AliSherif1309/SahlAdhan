name: Build Sahl Adhan APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # If you uploaded the project as SahlAdhan.zip, unpack it first
      - name: Unpack zip if present
        run: |
          if [ -f SahlAdhan.zip ] && [ ! -f settings.gradle.kts ]; then
            unzip -o SahlAdhan.zip
            if [ -d SahlAdhan ]; then cp -r SahlAdhan/. . ; fi
          fi
      # Public-domain (CC0) adhan recordings from Wikimedia Commons
      - name: Download adhan sounds
        run: |
          RAW=app/src/main/res/raw; mkdir -p $RAW
          UA="SahlAdhan-build/1.0 (https://github.com/AliSherif1309/SahlAdhan)"
          curl -fsSL -A "$UA" -o $RAW/adhan_beautiful.ogg "https://commons.wikimedia.org/wiki/Special:FilePath/Beautiful_adhan.ogg" || rm -f $RAW/adhan_beautiful.ogg
          curl -fsSL -A "$UA" -o $RAW/adhan_classic.ogg "https://commons.wikimedia.org/wiki/Special:FilePath/Adhan.ogg" || rm -f $RAW/adhan_classic.ogg
          if [ -f $RAW/adhan_classic.ogg ]; then
            ffmpeg -loglevel error -y -i $RAW/adhan_classic.ogg -t 10 -af "volume=6dB,afade=t=out:st=7:d=3" -c:a libvorbis $RAW/takbir.ogg || rm -f $RAW/takbir.ogg
          fi
          ls -la $RAW
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SahlAdhan-apk
          path: app/build/outputs/apk/release/*.apk
